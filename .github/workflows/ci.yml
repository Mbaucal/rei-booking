name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --dry-run --outdir dist/default
  calendar-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install isolated browser test tools
        run: npm install --prefix "$RUNNER_TEMP/rei-browser-tools" --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium headless shell
        run: node "$RUNNER_TEMP/rei-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
      - name: Check calendar in desktop, phone and tablet browsers
        env:
          REI_BROWSER_ARTIFACTS: browser-artifacts
        run: REI_PLAYWRIGHT_MODULE="$RUNNER_TEMP/rei-browser-tools/node_modules/playwright/index.mjs" node scripts/test-calendar-browser.mjs
      - name: Keep fictional calendar screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calendar-browser-screenshots
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Check history preview in desktop and phone browsers
        env:
          REI_BROWSER_ARTIFACTS: history-browser-artifacts
        run: REI_PLAYWRIGHT_MODULE="$RUNNER_TEMP/rei-browser-tools/node_modules/playwright/index.mjs" node scripts/test-history-browser.mjs
      - name: Keep fictional history screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: history-browser-screenshots
          path: history-browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7
